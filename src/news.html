<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{news.title}}</title>
<meta name="description" content="{{news.metaDesc}}">
{{@robots}}
{{@og}}
<meta name="theme-color" content="#0E0B2B">
<link rel="icon" href="{{@base}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="{{@base}}assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="{{@base}}assets/img/favicon-48.png">
<link rel="apple-touch-icon" href="{{@base}}assets/img/apple-touch-icon.png">
<link rel="canonical" href="{{@canonical}}">
{{@alternates}}
<link rel="preload" href="{{@base}}assets/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{@base}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{@base}}assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="{{@home}}" aria-label="{{home}}"><i aria-hidden="true"></i>WorkGuardAI</a>
    <div class="header-end">
      <nav class="lang" aria-label="{{nav.language}}">
{{@langnav}}
      </nav>
      <a class="btn btn-primary btn-small header-cta" href="{{@home}}#contact">{{home.book}}</a>
    </div>
  </div>
</header>

<main id="main" class="news-page">
  <div class="container">
    <p class="sec-index mono">{{news.index}}</p>
    <h1>{{nav.news}}</h1>
    <ol class="news-list news-list-full">
{{@newsAll}}
    </ol>
    <p class="legal-back"><a class="link-arrow" href="{{@home}}">{{privacy.back}} <span aria-hidden="true">→</span></a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="foot-base mono" style="margin-top:0"><span>© 2026 WorkGuardAI</span><span>{{footer.base}}</span></div>
  </div>
</footer>
<script src="{{@base}}assets/js/site.js" defer></script>
</body>
</html>
