<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{vpage.title}}</title>
<meta name="description" content="{{vpage.metaDesc}}">
{{@robots}}
{{@og}}
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" type="image/png" sizes="32x32" href="{{@base}}assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="{{@base}}assets/img/favicon-48.png">
<link rel="apple-touch-icon" href="{{@base}}assets/img/apple-touch-icon.png">
<link rel="canonical" href="{{@canonical}}">
{{@alternates}}
<link rel="preload" href="{{@base}}assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{@base}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{@base}}assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="{{@home}}" aria-label="{{home}}">
      <img src="{{@base}}assets/img/logo.png" alt="WorkGuardAI" width="433" height="71">
    </a>
    <div class="header-end">
      <nav class="lang" aria-label="{{nav.language}}">
{{@langnav}}
      </nav>
      <a class="btn btn-primary btn-small header-cta" href="{{@home}}#pilot">{{cta.pilot}}</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="section pv pv-page" aria-labelledby="vision-title">
    <svg class="pv-facets" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="pv-f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B6CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8EEBFF" stop-opacity=".05"/></linearGradient>
        <linearGradient id="pv-f2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EEBFF" stop-opacity=".22"/><stop offset="1" stop-color="#7B6CFF" stop-opacity=".02"/></linearGradient>
      </defs>
      <polygon points="1010,40 1110,140 1010,300 910,140" fill="url(#pv-f1)" stroke="rgba(217,210,247,.18)"/>
      <polygon points="1010,40 1110,140 1010,160" fill="url(#pv-f2)"/>
      <polygon points="120,520 170,570 120,650 70,570" fill="url(#pv-f2)" stroke="rgba(217,210,247,.14)"/>
      <polygon points="1130,420 1160,450 1130,500 1100,450" fill="url(#pv-f1)" stroke="rgba(217,210,247,.12)"/>
    </svg>
    <div class="container">
      <div class="sec-head">
        <p class="sec-index mono">{{vis.index}}</p>
        <h1 id="vision-title">{{vpage.h1}}</h1>
        <p class="sec-lead">{{vis.lead}}</p>
      </div>
{{@visionDevices}}
      <h2 class="pv-sub">{{vpage.screensH}}</h2>
      <p class="pv-tags"><span class="pv-chip">{{vis.concept}}</span><span class="pv-note mono">{{vis.illustrative}}</span></p>
      <div class="pv-cards">
        <figure class="pv-card">
          <svg viewBox="0 0 240 140" role="img" aria-label="{{vis.alt1}}">
            <text x="16" y="26" fill="#B9B2E6" font-size="11" font-family="JetBrains Mono, monospace">{{p.soil}}</text>
            <rect x="16" y="34" width="208" height="14" rx="7" fill="rgba(217,210,247,.15)"/><rect x="16" y="34" width="146" height="14" rx="7" fill="#5CF2B0"/>
            <text x="16" y="66" fill="#F4F2FF" font-size="11" font-family="JetBrains Mono, monospace">3,610 / 5,150 m³</text>
            <text x="16" y="90" fill="#B9B2E6" font-size="11" font-family="JetBrains Mono, monospace">{{p.rock}}</text>
            <rect x="16" y="98" width="208" height="14" rx="7" fill="rgba(217,210,247,.15)"/><rect x="16" y="98" width="72" height="14" rx="7" fill="#8EEBFF"/>
            <text x="16" y="130" fill="#F4F2FF" font-size="11" font-family="JetBrains Mono, monospace">1,210 / 3,480 m³</text>
          </svg>
          <figcaption><strong>{{vis.f5t}}</strong><span>{{vis.f5d}}</span></figcaption>
        </figure>
        <figure class="pv-card">
          <svg viewBox="0 0 240 140" role="img" aria-label="{{vis.alt2}}">
            <rect x="0" y="0" width="240" height="140" fill="rgba(255,255,255,.02)"/>
            <circle cx="104" cy="74" r="50" fill="rgba(255,184,107,.08)" stroke="#FFB86B" stroke-dasharray="5 4"/>
            <rect x="90" y="60" width="28" height="28" rx="4" fill="#7B6CFF"/><path d="M118 70L150 52" stroke="#7B6CFF" stroke-width="6" stroke-linecap="round"/>
            <circle cx="140" cy="94" r="6" fill="#FFB86B"/><path d="M140 100V112" stroke="#FFB86B" stroke-width="3"/>
            <rect x="132" y="8" width="102" height="20" rx="4" fill="rgba(14,11,43,.9)" stroke="rgba(255,184,107,.6)"/>
            <text x="138" y="22" fill="#F4F2FF" font-size="10" font-family="JetBrains Mono, monospace">{{p.zone}}</text>
          </svg>
          <figcaption><strong>{{vis.f8t}}</strong><span>{{vis.f8d}}</span></figcaption>
        </figure>
        <figure class="pv-card">
          <svg viewBox="0 0 240 140" role="img" aria-label="{{vis.alt3}}">
            <path d="M20 120L60 30H180L220 120Z" fill="rgba(217,210,247,.12)" stroke="#D9D2F7"/>
            <path d="M96 40l6 14-4 8 7 12" fill="none" stroke="#FFB86B" stroke-width="2"/>
            <circle cx="101" cy="56" r="14" fill="none" stroke="#8EEBFF" stroke-dasharray="3 3"/>
            <polyline points="130,108 150,104 170,100 190,92 210,84" fill="none" stroke="#5CF2B0" stroke-width="2"/>
            <text x="234" y="20" text-anchor="end" fill="#B9B2E6" font-size="9.5" font-family="JetBrains Mono, monospace">{{p.change}}</text>
          </svg>
          <figcaption><strong>{{vis.f11t}}</strong><span>{{vis.f11d}}</span></figcaption>
        </figure>
        <figure class="pv-card">
          <svg viewBox="0 0 240 140" role="img" aria-label="{{vis.alt4}}">
            <g font-size="11" font-family="JetBrains Mono, monospace">
              <rect x="12" y="14" width="216" height="32" rx="6" fill="rgba(255,255,255,.05)" stroke="rgba(217,210,247,.2)"/>
              <circle cx="28" cy="30" r="5" fill="#5CF2B0"/><text x="42" y="34" fill="#F4F2FF">{{p.model}} · v12</text>
              <rect x="12" y="54" width="216" height="32" rx="6" fill="rgba(255,255,255,.05)" stroke="rgba(217,210,247,.2)"/>
              <circle cx="28" cy="70" r="5" fill="#8EEBFF"/><text x="42" y="74" fill="#F4F2FF">{{p.delivery}} · DN400</text>
              <rect x="12" y="94" width="216" height="32" rx="6" fill="rgba(255,255,255,.05)" stroke="rgba(217,210,247,.2)"/>
              <circle cx="28" cy="110" r="5" fill="#7B6CFF"/><text x="42" y="114" fill="#F4F2FF">{{p.quantities}}</text>
            </g>
          </svg>
          <figcaption><strong>{{vis.f6t}}</strong><span>{{vis.f6d}}</span></figcaption>
        </figure>
        <figure class="pv-card">
          <svg viewBox="0 0 240 140" role="img" aria-label="{{vis.alt5}}">
            <g font-size="10" font-family="JetBrains Mono, monospace" fill="#F4F2FF">
              <rect x="22" y="30" width="26" height="18" rx="3" fill="#7B6CFF"/><path d="M35 48V70" stroke="#B9B2E6" stroke-width="2"/>
              <text x="12" y="92">{{p.camera}}</text><text x="12" y="108" fill="#5CF2B0">{{p.online}}</text>
              <path d="M100 40h40M120 40v10" stroke="#8EEBFF" stroke-width="3"/><rect x="108" y="48" width="24" height="10" rx="3" fill="#8EEBFF"/>
              <text x="92" y="92">{{p.drone}}</text><text x="92" y="108" fill="#8EEBFF">{{p.planned}}</text>
              <path d="M186 64v-6M194 64v-14M202 64v-22M210 64v-30" stroke="#5CF2B0" stroke-width="4" stroke-linecap="round"/>
              <text x="172" y="92">4G/5G</text><text x="172" y="108" fill="#5CF2B0">{{p.signal}}</text>
            </g>
          </svg>
          <figcaption><strong>{{vis.f7t}}</strong><span>{{vis.f7d}}</span></figcaption>
        </figure>
      </div>
      <h2 class="pv-sub">{{vpage.ideasH}}</h2>
{{@visionFeatures}}
      <p class="pv-more"><a class="btn btn-primary" href="{{@home}}?interest=pilot#work-form">{{cta.pilot}}</a> <a class="link-arrow" href="{{@home}}?interest=invest#work-form">{{cta.partner}} <span aria-hidden="true">→</span></a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="foot-base mono" style="margin-top:0"><span>© 2026 WorkGuardAI</span><span>{{footer.base}}</span></div>
  </div>
</footer>
<script src="{{@base}}assets/js/site.js" defer></script>
</body>
</html>
