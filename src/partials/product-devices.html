        <!-- What you get: the dashboard and the phone, showing only what the app does. Numbers are sample data. -->
        <figure class="pd-stage">
          <div class="pd-devices">

            <!-- Laptop: the dashboard -->
            <div class="pd-laptop" role="img" aria-label="{{prod.laptopAlt}}">
              <div class="pd-lid">
                <div class="pd-screen">
                  <div class="pd-bar">
                    <img src="{{@base}}assets/img/logo.png" alt="" width="433" height="71">
                    <span>{{d.site}} 01</span>
                    <span class="mono">{{d.lastPhoto}} 10:42</span>
                  </div>
                  <div class="pd-dash">
                    <div class="pd-panel pd-map">
                      <p class="pd-h">{{d.map}}</p>
                      <svg viewBox="0 0 400 230">
                        <g stroke="#ece9e1" stroke-width="1">
                          <path d="M40 0V230M100 0V230M160 0V230M220 0V230M280 0V230M340 0V230"/>
                          <path d="M0 40H400M0 90H400M0 140H400M0 190H400"/>
                        </g>
                        <g fill="#5f6880" font-family="JetBrains Mono, monospace" font-size="9">
                          <text x="67" y="14">B</text><text x="127" y="14">C</text><text x="187" y="14">D</text><text x="247" y="14">E</text><text x="307" y="14">F</text>
                        </g>
                        <path d="M20 196 C 80 186, 110 118, 170 116 S 260 70, 380 52" fill="none" stroke="#5255e0" stroke-width="1.5" stroke-dasharray="5 4"/>
                        <g stroke="#fff" stroke-width="2">
                          <circle cx="30" cy="194" r="6" fill="#17845a"/><circle cx="66" cy="182" r="6" fill="#17845a"/>
                          <circle cx="98" cy="156" r="6" fill="#17845a"/><circle cx="128" cy="128" r="6" fill="#17845a"/>
                          <circle cx="170" cy="116" r="7.5" fill="#5255e0"/><circle cx="206" cy="108" r="6" fill="#5255e0"/>
                          <circle cx="242" cy="94" r="6" fill="#5255e0"/><circle cx="280" cy="80" r="6" fill="#5255e0"/>
                          <circle cx="318" cy="68" r="6" fill="#fff" stroke="#85806f" stroke-width="1.5"/><circle cx="356" cy="58" r="6" fill="#fff" stroke="#85806f" stroke-width="1.5"/>
                        </g>
                        <circle cx="170" cy="116" r="12" fill="none" stroke="#5255e0" stroke-width="1"/>
                        <g font-family="JetBrains Mono, monospace" font-size="9">
                          <rect x="146" y="134" width="48" height="17" rx="2" fill="#0f1b3d"/>
                          <text x="154" y="146" fill="#fff">D·04</text>
                        </g>
                      </svg>
                      <p class="pd-legend"><span><i class="pd-not"></i>{{d.lNot}} &lt;10%</span><span><i style="background:#5255e0"></i>{{d.lProg}}</span><span><i style="background:#17845a"></i>{{d.lDone}} &gt;90%</span></p>
                    </div>
                    <div class="pd-panel pd-overall">
                      <p class="pd-h">{{d.overall}}</p>
                      <p class="pd-big">62%</p>
                      <div class="pd-meter"><span style="width:62%"></span></div>
                    </div>
                    <div class="pd-panel pd-point">
                      <p class="pd-h">{{d.point}} D·04</p>
                      <p class="pd-row"><span>{{d.planned}}</span><b>−2.40 m</b></p>
                      <p class="pd-row"><span>{{d.estimated}}</span><b>−1.49 m</b></p>
                      <p class="pd-row"><span>{{d.progress}}</span><b class="pd-prog">62%</b></p>
                    </div>
                    <div class="pd-panel pd-notifs">
                      <p class="pd-h">{{d.notifs}}</p>
                      <ul>
                        <li><i style="background:#5255e0"></i><span>{{d.n1}}</span><time class="mono">10:42</time></li>
                        <li><i style="background:#17845a"></i><span>{{d.n2}}</span><time class="mono">06:42</time></li>
                        <li><i style="background:#9a5f00"></i><span>{{d.n3}}</span><time class="mono">06:42</time></li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
              <div class="pd-deck" aria-hidden="true"></div>
            </div>

            <!-- Phone: the email alert and an upload at a plan coordinate -->
            <div class="pd-phone" role="img" aria-label="{{prod.phoneAlt}}">
              <div class="pd-phone-screen">
                <div class="pd-mail">
                  <p class="pd-mail-from"><b>WorkGuardAI</b><span class="mono">10:42</span></p>
                  <p class="pd-mail-subject">{{d.alertT}} · D·07</p>
                  <p class="pd-row"><span>{{d.current}}</span><b>−1.10 m</b></p>
                  <p class="pd-row"><span>{{d.planned}}</span><b>−2.40 m</b></p>
                </div>
                <p class="pd-h">{{d.upload}}</p>
                <svg class="pd-photo" viewBox="0 0 216 132">
                  <rect width="216" height="132" fill="#d9d3c6"/>
                  <path d="M0 52H58L80 110H136L158 52H216V132H0Z" fill="#b8ab90"/>

                </svg>
                <div class="pd-fields">
                  <span class="pd-field"><small>X</small>6 120.0</span>
                  <span class="pd-field"><small>Y</small>4 048.5</span>
                </div>
                <span class="pd-button">{{d.send}} · D·04</span>
              </div>
            </div>
          </div>
          <figcaption class="pd-caption mono">{{prod.sample}}</figcaption>
        </figure>
