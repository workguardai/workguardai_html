<!-- Hero mockups: laptop plan view and phone alert. Sample data only. -->
    <div class="x-stage reveal">
      <!-- Laptop: plan view with dashed planned and solid estimated lines, and a 58% progress ring -->
      <div class="laptop">
        <div class="lid">
          <div class="screen">
            <svg viewBox="0 0 640 400" role="img" aria-label="{{home.laptopAlt}}">
              <rect width="640" height="400" fill="#F6FAFF"/>
              <rect width="640" height="36" fill="#fff"/>
              <path d="M0 36H640" stroke="#C9DDF0"/>
              <path d="M24 18 30 12 36 18 30 24Z" fill="#5446C9"/>
              <text x="46" y="22" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="12" fill="#1B1650">WorkGuardAI</text>
              <text x="150" y="22" font-family="Inter, sans-serif" font-size="11" fill="#4A4F7A">{{home.mPlan}}</text>
              <text x="616" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" fill="#4A4F7A" letter-spacing=".6">{{home.sampleU}}</text>
              <g transform="translate(176 0)">
                <!-- plan grid -->
                <g stroke="#E4F1FD" stroke-width="1">
                  <path d="M60 50V400M120 50V400M180 50V400M240 50V400M300 50V400M360 50V400M420 50V400"/>
                  <path d="M14 90H470M14 150H470M14 210H470M14 270H470M14 330H470"/>
                </g>
                <!-- planned (dashed) and estimated (solid) -->
                <path d="M40 330 C 110 320, 140 250, 200 230 S 300 150, 420 110" fill="none" stroke="#5446C9" stroke-width="2.5" stroke-dasharray="8 6"/>
                <path d="M40 350 C 110 340, 140 290, 200 268 S 300 200, 420 168" fill="none" stroke="#5446C9" stroke-width="2.5" stroke-dasharray="8 6" opacity=".45"/>
                <path class="est-line" d="M40 330 C 110 320, 140 250, 200 230 S 262 186, 290 172" fill="none" stroke="#17845A" stroke-width="4" stroke-linecap="round"/>
                <g font-family="JetBrains Mono, monospace" font-size="9" fill="#1B1650">
                  <circle cx="62" cy="324" r="7" fill="#17845A" stroke="#fff" stroke-width="2"/><text x="56" y="306">C1</text>
                  <circle cx="132" cy="290" r="7" fill="#17845A" stroke="#fff" stroke-width="2"/><text x="126" y="272">C2</text>
                  <circle cx="200" cy="230" r="7" fill="#17845A" stroke="#fff" stroke-width="2"/><text x="194" y="212">C3</text>
                  <circle class="pulse" cx="262" cy="190" r="7" fill="none" stroke="#E08A2E" stroke-width="2"/>
                  <circle cx="262" cy="190" r="7" fill="#E08A2E" stroke="#fff" stroke-width="2"/><text x="256" y="172">C4</text>
                  <circle cx="334" cy="150" r="7" fill="#fff" stroke="#5446C9" stroke-width="2"/><text x="328" y="132">C5</text>
                  <circle cx="404" cy="116" r="7" fill="#fff" stroke="#5446C9" stroke-width="2"/><text x="398" y="98">C6</text>
                </g>
                <!-- legend -->
                <g font-family="Inter, sans-serif" font-size="10" fill="#4A4F7A">
                  <path d="M40 372H62" stroke="#5446C9" stroke-width="2.5" stroke-dasharray="6 4"/><text x="68" y="375">{{home.mPlanned}}</text>
                  <path d="M128 372H150" stroke="#17845A" stroke-width="4" stroke-linecap="round"/><text x="156" y="375">{{home.mEst}}</text>
                </g>
              </g>
              <!-- progress panel, left -->
              <rect x="0" y="36" width="190" height="364" fill="#fff"/>
              <path d="M190 36V400" stroke="#C9DDF0"/>
              <text x="22" y="66" font-family="JetBrains Mono, monospace" font-size="9" fill="#4A4F7A" letter-spacing=".6">{{home.mSite}}</text>
              <g transform="translate(95 136)">
                <circle r="44" fill="none" stroke="#E4F1FD" stroke-width="11"/>
                <circle class="ring-fill" r="44" fill="none" stroke="#17845A" stroke-width="11" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="116" transform="rotate(-90)"/>
                <text y="9" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="26" fill="#1B1650">58%</text>
              </g>
              <path d="M22 208H168" stroke="#E4F1FD"/>
              <g font-family="Inter, sans-serif" font-size="11" fill="#1B1650">
                <circle cx="28" cy="230" r="4" fill="#17845A"/><text x="40" y="234">{{home.mDone}}</text><text x="168" y="234" text-anchor="end">3</text>
                <circle cx="28" cy="254" r="4" fill="#E08A2E"/><text x="40" y="258">{{home.mBehind}}</text><text x="168" y="258" text-anchor="end">1</text>
                <circle cx="28" cy="278" r="4" fill="#fff" stroke="#5446C9" stroke-width="1.5"/><text x="40" y="282">{{home.mNot}}</text><text x="168" y="282" text-anchor="end">2</text>
              </g>
              <path d="M22 302H168" stroke="#E4F1FD"/>
              <text x="22" y="326" font-family="JetBrains Mono, monospace" font-size="9" fill="#4A4F7A" letter-spacing=".6">{{home.mLast}}</text>
              <text x="22" y="346" font-family="Inter, sans-serif" font-size="11" fill="#1B1650">C4 · {{home.mToday}} 10:42</text>
            </svg>
          </div>
        </div>
        <div class="base" aria-hidden="true"></div>
      </div>

      <!-- Phone: the alert -->
      <div class="phone float">
        <div class="screen">
          <svg viewBox="0 0 220 420" role="img" aria-label="{{home.phoneAlt}}">
            <rect width="220" height="420" fill="#F6FAFF"/>
            <rect x="80" y="10" width="60" height="16" rx="8" fill="#0b0920"/>
            <text x="20" y="22" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#1B1650">9:41</text>
            <!-- notification -->
            <rect x="12" y="40" width="196" height="92" rx="18" fill="#fff" stroke="#C9DDF0"/>
            <path d="M30 60 36 54 42 60 36 66Z" fill="#5446C9"/>
            <text x="50" y="64" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#4A4F7A" letter-spacing=".5">WORKGUARDAI · {{home.mNow}}</text>
            <text x="24" y="88" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="12.5" fill="#1B1650">{{home.alertT}}</text>
            <text x="24" y="110" font-family="Inter, sans-serif" font-size="11" fill="#4A4F7A">{{home.alertB}}</text>
            <!-- photo tied to C4 -->
            <g transform="translate(12 148)">
              <rect width="196" height="140" rx="16" fill="#B9D7EF"/>
              <path d="M0 70H54L76 120H124L146 70H196V140H0Z" fill="#A08C70"/>
              <path d="M54 70L76 120H124L146 70" fill="none" stroke="#7E6C55" stroke-width="2"/>
              <path d="M0 70H54L70 104H130L146 70H196" fill="none" stroke="#5446C9" stroke-width="1.5" stroke-dasharray="5 4"/>
              <rect x="12" y="12" width="40" height="20" rx="10" fill="#1B1650"/>
              <text x="32" y="26" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">C4</text>
            </g>
            <!-- point progress -->
            <g transform="translate(52 344)">
              <circle r="26" fill="none" stroke="#E4F1FD" stroke-width="7"/>
              <circle class="ring-fill" r="26" fill="none" stroke="#E08A2E" stroke-width="7" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="81.5" transform="rotate(-90)"/>
              <text y="5" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="14" fill="#1B1650">50%</text>
            </g>
            <text x="86" y="338" font-family="Inter, sans-serif" font-size="10" fill="#4A4F7A">{{home.mDepth}}</text>
            <text x="86" y="356" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="14" fill="#1B1650">1.2 m / 2.4 m</text>
            <text x="20" y="400" font-family="JetBrains Mono, monospace" font-size="8" fill="#4A4F7A" letter-spacing=".6">{{home.sampleU}}</text>
          </svg>
        </div>
      </div>
      <p class="sample">{{home.sample}}</p>
    </div>
